name: CI

# Se ejecuta en cada PR hacia develop o main (y en push directo a esas ramas).
# Para impedir el merge si algo falla, activa "Require status checks" en la
# protección de rama y marca: Tests API, Build (...) y Revisión de seguridad.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        app: [web-admin, web-empleados, web-clientes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @resttek/${{ matrix.app }}

  security-review:
    name: Revisión de seguridad (Claude)
    runs-on: ubuntu-latest
    needs: [test, build]
    # Solo en PRs; los PRs desde forks no reciben secretos, así que se omiten.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Analizar cambios en busca de fallos de seguridad
        env:
          # Token OAuth generado con `claude setup-token` (suscripción Pro/Max).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff "origin/${BASE_REF}...HEAD" > /tmp/cambios.diff

          claude -p "Eres un revisor de seguridad. Analiza SOLO los cambios de /tmp/cambios.diff (diff de esta PR contra ${BASE_REF}); puedes leer el resto del repo para entender el contexto. Busca vulnerabilidades introducidas por las modificaciones: inyección SQL, XSS, fallos de autenticación o autorización (IDOR, falta de authorize, aislamiento entre restaurantes), secretos o credenciales en código, JWT mal configurado, validación de entrada insuficiente, exposición de datos sensibles y dependencias inseguras. Ignora problemas preexistentes no tocados por el diff. Responde en español con una lista de hallazgos (fichero, línea, severidad, explicación y arreglo propuesto). La ÚLTIMA línea debe ser exactamente 'VEREDICTO: OK' si no hay hallazgos de severidad media o superior, o 'VEREDICTO: FALLO' en caso contrario." \
            --allowedTools "Read,Grep,Glob" \
            --max-turns 20 \
            --output-format text | tee /tmp/informe.md

          tail -n 1 /tmp/informe.md | grep -q '^VEREDICTO: OK$'

      - name: Publicar informe en el resumen del job
        if: always()
        run: |
          {
            echo "## Revisión de seguridad (Claude)"
            cat /tmp/informe.md 2>/dev/null || echo "Sin informe."
          } >> "$GITHUB_STEP_SUMMARY"
